name: Build Leordou APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v4
      - name: Build debug APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Leordou.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Leordou-APK
          path: app/build/outputs/apk/debug/Leordou.apk
